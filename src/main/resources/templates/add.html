<!DOCTYPE html>
<html xmlns:th="http://ww.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>顧客情報追加</title>
    </head>
    <body>
        <h1>顧客情報追加</h1>
        <form th:action="@{/add}" th:object="${customer}" method="post">
            <p>名前</p>
            <input type="text" th:field="*{name}">
            <p>メールアドレス</p>
            <input type="email" th:field="*{email}">

            <br><br>
            <button type="submit">登録</button>
        </form>
    </body>
</html>
