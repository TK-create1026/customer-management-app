<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>顧客情報検索</title>
    </head>
    <body>
        <h1>顧客情報検索</h1>

        <p th:if="${message}"
        th:text="${message}"
        style="color:red;">
        </p>

        <form th:action="@{/search/result}"
        method="get">
            <p>名前</p>
            <input type="text" name="name">

            <p>性別</p>
            <select name="gender">
                <option value="">選択してください。</option>
                <option value="男性">男性</option>
                <option value="女性">女性</option>
                <option value="その他">その他</option>
            </select>

            <br><br>
            <button type="submit">
                検索
            </button> 
        </form>
        <br>
         <a href="/">ホームへ戻る</a>
    </body>
</html>
