<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>メールアドレス変更</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="container">
        <h1>メールアドレス変更</h1>
        
        <p th:if="${message}"
        th:text="${message}"
        class="error">
        </p>
        <form th:action="@{/user/mypage/lookup/email-update}"
        th:object="${customer}"
        method="post">
        <p>新しいメールアドレス</p>
        <input type="email"
        th:field="*{email}">
        <br><br>

        <button type="submit">変更</button>
        <br><br>
        <button type="button" onclick="location.href='/user/mypage/lookup'">戻る</button>
        </form>
        </div>
    </body>
</html>
