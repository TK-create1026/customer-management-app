<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>パスワード変更</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="container">
        <h1>パスワード変更</h1>

        <p th:if="${message}"
        th:text="${message}"
        class="error">
        </p>

        <form th:action="@{/customer/password}"
        th:object="${customer}"
        method="post">

        <input type="hidden" th:field="*{id}">

            <p>新しいパスワード</p>
            <input type="password" th:field="*{password}">

            <br><br>

            <button type="submit">変更</button>
            <br><br>
            <button type="button" onclick="location.href='/customer/list'">キャンセル</button>
        </form>
        </div>
    </body>
</html>
